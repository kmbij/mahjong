<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雀友懲罰房間</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="container">
    <h1>🀄️ 雀友懲罰器</h1>

    <div id="lobby">
      <div class="settings">
        <!-- Emoji 與暱稱輸入 -->
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <label style="color:var(--mj-gold); font-size: 0.85rem; display:block; margin-bottom:4px;">你的 Emoji：</label>
            <input type="text" id="userEmoji" value="🀄️" maxlength="4" style="text-align: center; margin-bottom:0; font-size: 1.2rem;">
          </div>
          <div style="flex: 3;">
            <label style="color:var(--mj-gold); font-size: 0.85rem; display:block; margin-bottom:4px;">你的暱稱：</label>
            <input type="text" id="userName" placeholder="請輸入暱稱" style="margin-bottom:0;">
          </div>
        </div>
        
        <!-- 房主建立時可設定預設底台 -->
        <div style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 10px;">
          <div style="flex: 1;">
            <label style="font-size: 0.85rem; color:var(--mj-gold);">預設底分：</label>
            <input type="number" id="initBaseInput" value="20" style="margin-bottom:0;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.85rem; color:var(--mj-gold);">一台多少分：</label>
            <input type="number" id="initTaiInput" value="5" style="margin-bottom:0;">
          </div>
        </div>

        <button onclick="createRoom()" style="background:var(--mj-gold); color:var(--mj-bg); box-shadow: 0 4px 0 #b8860b; margin-bottom:10px; margin-top: 10px;">建立房間 (房主)</button>
        <div style="margin:10px 0; opacity:0.6; text-align:center;">———— 或 ————</div>
        <input type="text" id="joinRoomId" placeholder="輸入 4 碼房號" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:none;">
        <button onclick="joinRoom()" style="background:#555; box-shadow: 0 4px 0 #333;">加入房間</button>
      </div>
    </div>

    <div id="roomArea" style="display:none;">
      <div class="room-header">
        <h2 style="color:var(--mj-gold)">房間：<span id="currentRoomDisplay">----</span></h2>
        <div style="font-weight:bold; margin-bottom:10px; text-align:center;">第 <span id="roundNumber">1</span> 局</div>
        <div id="playerList" class="player-tags"></div>
      </div>

      <div id="hostControls" style="display:none;">
        <div class="host-panel">
          <button onclick="startNextRound()" id="hostBtn">下一局 (重置)</button>
          <button onclick="revealResults()" id="revealBtn" style="margin-top:10px;">開牌 (公布)</button>
          
          <div class="mode-switch" style="margin-top:15px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">
            <label style="color:var(--mj-gold); font-size:0.9rem; display:block; margin-bottom:5px;">⚙️ 牌局規則設定：</label>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <input type="number" id="ruleBase" placeholder="底分" style="margin-bottom:0; padding:6px;" onchange="updateRules()">
              <input type="number" id="ruleTai" placeholder="一台" style="margin-bottom:0; padding:6px;" onchange="updateRules()">
            </div>

            <label style="color:var(--mj-gold); font-size:0.9rem; display:block; margin-bottom:5px;">🎲 懲罰模式：</label>
            <select id="penaltyMode" onchange="syncMode()" style="width:100%; padding:8px; border-radius:5px; border:none; font-weight:bold;">
              <option value="official">官方固定庫</option>
              <option value="custom">自訂同步區 (下方輸入框)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="main-card">
        <div id="display" class="result-box">等候開局...</div>
        <button id="drawBtn" onclick="draw()" disabled>摸牌 (抽籤)</button>
        
        <div id="reRollControls" style="display:none; gap:10px; margin-top:15px;">
          <button onclick="reRoll('t')" style="background:#8d6e63; font-size:0.85rem; padding:10px; box-shadow:0 4px 0 #5d4037;">重抽觸發條件</button>
          <button onclick="reRoll('a')" style="background:#546e7a; font-size:0.85rem; padding:10px; box-shadow:0 4px 0 #37474f;">重抽懲罰內容</button>
        </div>
      </div>

      <!-- 📊 玩家積分榜與計分區塊 -->
      <div class="settings" style="margin-top:20px;">
        <h3 style="color:var(--mj-gold)">📊 玩家積分榜 (<span id="ruleDisplay">底 - / 台 -</span>)</h3>
        <div id="scoreboardList" style="margin-bottom: 15px; font-size: 0.95rem;">
          <!-- 動態載入積分 -->
        </div>

        <h4 style="color:var(--mj-gold); margin-bottom: 8px;">➕ 記錄本局結算</h4>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <select id="winType" onchange="toggleWinType()" style="padding: 8px; border-radius: 5px;">
            <option value="zimo">自摸</option>
            <option value="fangchong">放銃（胡牌）</option>
          </select>
          
          <select id="winnerSelect" style="padding: 8px; border-radius: 5px;">
            <option value="">選擇胡牌/自摸者</option>
          </select>

          <select id="loserSelect" style="padding: 8px; border-radius: 5px; display: none;">
            <option value="">選擇放槍者</option>
          </select>

          <input type="number" id="taishuInput" placeholder="輸入台數 (例如: 3)" value="1" min="1" style="margin-bottom: 0;">

          <button onclick="submitScore()" style="background: linear-gradient(to bottom, #43a047, #2e7d32); box-shadow: 0 4px 0 #1b5e20; margin-top: 5px;">送出本局結算並更新積分</button>
          <button onclick="undoLastScore()" style="background: linear-gradient(to bottom, #78909c, #455a64); box-shadow: 0 4px 0 #263238; margin-top: 4px; font-size: 0.95rem; padding: 10px;">🔄 復原上一局結算</button>
        </div>
      </div>

      <div class="settings" style="margin-top:20px;">
        <h3>⚙️ 自訂懲罰清單</h3>
        <textarea id="triggersInput">有人打條子, 講到數字, 上家喊「碰」，下家吃牌, 自己丟牌</textarea>
        <textarea id="actionsInput">模仿一拳超人, 大喊「我是豬」, 起立蹲下一次, 深情看著上家10秒, 站起來轉圈</textarea>
        <button onclick="syncData()" style="font-size:0.9rem; padding:10px; background:#2196F3; box-shadow: 0 4px 0 #0d47a1;">同步內容至全房間</button>
      </div>

      <div class="history-section" style="margin-top:20px;">
        <h3 style="color:var(--mj-gold)">📜 本局結果</h3>
        <div id="roundResults" class="history-list">
          <div style="opacity:0.5; text-align:center;">等候房主揭曉...</div>
        </div>
      </div>
      
      <button onclick="location.reload()" style="background:#444; margin-top:20px; font-size:0.9rem; padding:10px; box-shadow:0 4px 0 #222;">退出房間</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
  <script src="./script.js"></script>
</body>
</html>
